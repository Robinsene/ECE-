name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p bin
          javac -Xlint:all -d bin $(find src -name '*.java')

      - name: Check resources referenced by code exist
        run: test -f res/graphics && test -f res/scores

  # Unit tests of the game logic (Team ECE - KAN-35). JUnit 4 is fetched
  # from Maven Central, so the repository needs no build tool or jar.
  test:
    runs-on: ubuntu-latest
    env:
      JUNIT: https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
      HAMCREST: https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JUnit
        run: |
          mkdir -p lib
          curl -sSfL -o lib/junit.jar "$JUNIT"
          curl -sSfL -o lib/hamcrest.jar "$HAMCREST"

      - name: Compile game and tests
        run: |
          mkdir -p bin test-bin
          javac -d bin $(find src -name '*.java')
          javac -d test-bin -cp bin:lib/junit.jar $(find test -name '*.java')

      - name: Run tests
        run: |
          classes=$(cd test && find . -name '*Test.java' | sed 's|^\./||; s|\.java$||; s|/|.|g')
          java -Djava.awt.headless=true -cp test-bin:bin:res:lib/junit.jar:lib/hamcrest.jar \
            org.junit.runner.JUnitCore $classes

  # The other teams' regression programs in tests/ (Team ECE - KAN-61).
  # They read res/ from the repository root and need a display.
  course-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      - name: Compile game and regression tests
        run: |
          mkdir -p bin tests-bin
          javac -d bin $(find src -name '*.java')
          javac -d tests-bin -cp bin tests/*.java

      - name: Run regression tests
        run: |
          for t in $(cd tests && ls *.java | sed 's/\.java$//'); do
            echo "== $t"
            xvfb-run -a java -cp tests-bin:bin:res "$t"
          done

  # Static analysis of the code Team ECE owns (KAN-61): complexity, size and
  # common mistakes. Fails on any violation; the report is kept as an
  # artifact. See docs/code-quality.md.
  quality:
    runs-on: ubuntu-latest
    env:
      PMD_ZIP: https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.8.0/pmd-dist-7.8.0-bin.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download PMD
        run: |
          curl -sSfL -o pmd.zip "$PMD_ZIP"
          unzip -q pmd.zip

      - name: Run PMD
        run: |
          files=$(paste -sd, .github/quality/ece-files.txt)
          pmd-bin-7.8.0/bin/pmd check -d "$files" \
            -R .github/quality/ece-ruleset.xml -f html -r pmd-report.html \
            --no-cache --no-fail-on-violation
          pmd-bin-7.8.0/bin/pmd check -d "$files" \
            -R .github/quality/ece-ruleset.xml -f text --no-cache

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: pmd-report.html

  # Runs the game for a few seconds on a virtual display and fails if it
  # throws. Compiling is not enough: a missing font made the game die on the
  # first frame while the window stayed open, which looked like a white screen
  # and passed the compile check. Process "still alive" is not a pass either,
  # because Swing keeps the window open after the main thread dies, so the
  # verdict comes from the log.
  #
  # CI has no res/font.ttf (it is gitignored), so this also covers a fresh
  # clone or an IDE that does not put res on the classpath.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p bin
          javac -d bin $(find src -name '*.java')

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      - name: Run the game for 10 seconds
        run: xvfb-run -a timeout 10 java -cp bin:res engine.Core > game.log 2>&1 || true

      - name: Check the log
        run: |
          cat game.log
          if grep -q "Exception" game.log; then
            echo "::error::The game threw an exception while starting. See the log above."
            exit 1
          fi
          if ! grep -q "title screen" game.log; then
            echo "::error::The game never reached the title screen."
            exit 1
          fi
          echo "Reached the title screen with no exceptions."
